name: Core algorithms and scenario contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m cv_project start --pipeline yolo26 --scenario occluded_sign --dry-run
      - run: python -m compileall -q cv_project perception webots/controllers webots/scripts
